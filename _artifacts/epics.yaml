    stories: [C03, C04, C10, C17a, C17b, C25a, C25b, C45]
  "Privates":
    concept: "The 30 privates — permit privates, the opener, and the rest."
    track: content
    prd: "prd-game.md 4.3"
    stories: [C05, C10, C11a, C11b, C12, C42, C43, C44, C26, C46, C47]
  "Rules & Balance":
    concept: "How 18Dragon plays and the numbers that keep it fair."
    track: content
    prd: "prd-game.md 5-7, 9"
    stories: [C06, C07, C08, C09, C13, C14, C20]
  "Rulebook":
    concept: "The 1822-diff rulebook deliverable."
    track: content
    prd: "prd-game.md 10.1"
    stories: [C22, C23]
  "Game Components":
    concept: "The 18xxMaker-produced pieces (section 11 manifest) beyond the map."
    track: content
    prd: "prd-game.md 11"
    stories: [C15, C16, C17a, C17b, C18, C19, C20, C21, C25a, C25b, C26, C42, C43, C44, C45, C47]
