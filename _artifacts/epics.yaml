# 18Dragon — epics (concept clusters; many-to-many with stories)
#
# Epics organize stories by concept; a story may belong to several. Epics do NOT
# imply a schedule — that's sprints. Members are story IDs (see backlog.yaml).
# Derived from prd-game.md + prd-tooling.md.

epics:
  # --- Dev (18xxMaker fork) ---
  "Custom SVG":
    concept: "Render arbitrary full-color SVG artwork on hexes/tiles."
    track: dev
    prd: "prd-tooling.md 2.1"
    stories: [D01, D02, D03, D04]
  "Permit Overlay":
    concept: "Region-permit letters that stay visible under placed track tiles."
    track: dev
    prd: "prd-tooling.md 2.2"
    stories: [D05, D06]
  "Ruins Rendering":
    concept: "Rendering the special ruins hexes (marker + styling)."
    track: dev
    prd: "prd-tooling.md 2.3"
    stories: [D07]
  "Renderer Foundations":
    concept: "Cross-cutting renderer plumbing other dev work builds on."
    track: dev
    prd: null
    stories: [D01, D05]

  # --- Content (game material, components & rules) ---
  "World & Map":
    concept: "The physical board — regions, island, tiles, and on-board tracks."
    track: content
    prd: "prd-game.md 3, 11"
    stories: [C01, C02, C15, C16, C27, C28, C29, C30, C31, C32, C33, C34, C35, C36, C37, C38, C39, C40]
  "Companies":
