# 18Dragon — story catalog (descriptive; stable)
#
# id -> title, type, epics, points. STATUS and SPRINT membership live in
# sprint-status.yaml. Epic definitions in epics.yaml. `points` is null until a
# story is pointed during sprint planning (agile-sprint-plan). This file changes
# when stories are added/split/re-titled or (re)pointed.

stories:
  # --- DEV (18xxMaker fork) ---
  D01:
    title: "Register art glob + registry export"
    type: dev
    epics: ["Custom SVG", "Renderer Foundations"]
    points: 1
  D02:
    title: "Art shape atom (sized/positioned/layerable)"
    type: dev
    epics: ["Custom SVG"]
    points: 3
  D03:
    title: "Wire art type into Shape.jsx mapping"
    type: dev
    epics: ["Custom SVG"]
    points: 2
  D04:
    title: "Sample art asset proves render on a hex"
    type: dev
    epics: ["Custom SVG"]
    points: 1
    # Carry-over from D02 QA: must verify `opacity` passthrough on the compiled SVG.
    # Icon.jsx proves width/height/x/y reach the root <svg>, but opacity via
    # vite-plugin-fast-react-svg is UNPROVEN — add an AC to render an art element
    # with opacity < 1 and confirm it visibly renders semi-transparent.
  D05:
    title: "Permit letters -> top-most overlay layer"
    type: dev
    epics: ["Permit Overlay", "Renderer Foundations"]
    points: 3
  D06:
    title: "Permit letter stays visible over placed tiles"
    type: dev
    epics: ["Permit Overlay"]
    points: 2
  D07:
    title: "Render special ruins hex styling"
    type: dev
    epics: ["Ruins Rendering", "Verantum"]
    points: 3
  # D08 (annotate ruins upgrade targets) was DROPPED 2026-07-24: the ruins SVG
  # marker (D07) already signals that ruins tile-lays are allowed on the hex.
  # Placement follows normal tile rules (track must connect, etc.), covered by the
  # rulebook — no per-hex board annotation needed.
  D09:
    title: "Cameo Print & Cut hex-tile sheet renderer (reuse Tile.jsx headlessly)"
    type: dev
    epics: ["Tile Printing"]
    points: 5

  D10:
    title: "Tile-sheet cut/crop guide marks for hand-cutting"
    type: dev
    epics: ["Tile Printing"]
    points: null
    # Contingency (raised sprint-14 close): if the Kraft blade can't be tuned to cut
    # laminated tiles cleanly, D09 sheets need printed crop/guide marks at hex edges
    # so the designer can hand-cut accurately. Hold until the blade test resolves —
    # may be unneeded if the Kraft blade works. See D09 + sprint-14 retro.

  # --- CONTENT (game material, components & rules) ---
  # Board split (2026-07-24, sprint-2 planning): each region = a geography pass +
