    type: content
    epics: ["World & Map", "Verantum"]
    points: 2
  C02:
    title: "Map skeleton — place the 5 regions on the grid (from doodle map)"
    type: content
    epics: ["World & Map"]
    points: null
    # DONE (2026-08-04): never run as a standalone story; the 5-region grid was
