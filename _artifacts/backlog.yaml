  C44:
    title: "Print-ready per-card files with bleed (pro printing)"
    type: content
    epics: ["Privates", "Game Components"]
    points: null

  # Follow-ups surfaced during the C17 charter mockup (2026-08-04):
  C45:
    title: "Auto-generate unique company logos (reused on tokens/charters/stickers/cards)"
    type: content
    epics: ["Companies", "Game Components"]
    points: null
  C46:
    title: "Permit-block backs for the 5 permit privates (match the minor-charter permit)"
    type: content
    epics: ["Privates", "Permits"]
    points: null
  C47:
    title: "No-edge / bleed print treatment for private + train card generators"
    type: content
    epics: ["Privates", "Game Components"]
    points: null
    # Charters (C17) print with no card border + crop marks + bleed for miscut
    # tolerance. Retrofit the same to gen-private-cards.mjs and gen-train-cards.mjs
    # (currently borders-as-cut-lines). Related to C44 (pro per-card bleed).

  C48:
    title: "Resize cert deck to 67×44mm (adapt the existing design)"
    type: content
    epics: ["Game Components"]
    points: 2
    # BUG found during C18: gen-certs.mjs makes certs at 89×55mm, but privates,
    # trains, AND the bid-box centers are all 67×44mm — all cards must match. 89×55
    # was baked into gen-certs when C25 was written. The cert *design* is liked
    # (mockup-driven), so this is ADAPT-DOWN, not a redesign: fit the band/logos/text
    # to 67×44 + new grid. Source of truth: 67×44 (gen-private-cards / gen-train-cards).
    # Prereq for C49 (unified printing).

  C49:
    title: "Unified card-deck printing — certs + trains + privates on shared sheets"
    type: content
    epics: ["Game Components"]
    points: 5
    # Print certs + trains + privates (all 67×44) together on combined US-Letter
    # sheets to kill wasted pages. Handle the single-sided (certs) vs double-sided
    # (trains/privates) mix — e.g. group all fronts then all backs, certs get a blank
    # back (or fill those back slots). Likely a shared cardkit pagination. Uses the
    # CURRENT train/private art (look redesign = C50, later). C19 misc cards join this
    # once authored. Depends on C48.

  C50:
    title: "Redesign train + private card faces (mockup-driven)"
    type: content
    epics: ["Game Components", "Privates"]
    points: 5
    # Trains/privates are the right SIZE (67×44) but their faces don't look as good as
    # the mockup-driven certs. Do a mockup-first quality pass to match. Independent of
    # C49's print plumbing (sheets re-render after). Designer chose "unify now, redesign
    # later" (2026-08-17).
    # Faces agreed 2026-08-17. Mockups: docs/mockups/private-card-mockup.html
    # (direction A "Ledger" + 30 sigils) and docs/mockups/train-card-mockup.html
    # (spacing pass, same anatomy) via tools/mockup-{privates,trains}.mjs.
    # Full decision record + ACs: _artifacts/stories/C50-card-face-redesign.md

  C51:
    title: "Resize stickers to the real token dimensions"
    type: content
    epics: ["Game Components"]
    points: 3
    # Real token dims (designer 2026-08-18): STATION tokens 10mm dia x 10mm tall
    # cylinders; MARKET tokens (and the round marker) 12mm dia x 5mm discs; bid cubes
    # 8mm (no sticker). stickers.py is currently 12mm station-type stickers (major
    # logo/home/dest + 30 minor numbers + misc) + 15mm share-price markers, REVEAL 0.5mm.
    # Resize: station-type 12 -> 10mm, share-price 15 -> 12mm (REVEAL unchanged);
    # confirm where "misc" belongs. Fix tools/stickers.py + regenerate print/stickers.*.
    # Shared spec with C52 (STLs) and C53 (round tracker).

  C52:
    title: "Token-piece STL generator (3D-printable)"
    type: content
    epics: ["Game Components"]
    points: 5
    # ONE MASTER STL per piece type (designer duplicates on the print bed, no plated set):
    #   station token  10mm dia x 10mm  cylinder
    #   market/round   12mm dia x 5mm   disc  (one STL serves market markers + round marker)
    #   bid cube       8mm cube         (no sticker)
    # Sticker seats FLAT (no recess). New tooling (tools/gen-token-stls.* — simple
    # cylinder/cube tessellation to STL, no OpenSCAD needed). Depends on C51 dims.

  C53:
    title: "Enlarge board round tracker to fit the 12mm marker"
    type: dev
    epics: ["World & Map", "Game Components"]
    points: 2
    # The round marker is a 12mm disc, so the map round tracker (C16) must hold it. The
    # size is NOT a game-file field — it's config.tokens.marketTokenSize (fork default 50).
    # Designer chose (2026-08-18) to bump the global value (18Dragon doesn't use 18xxMaker's
    # digital market tokens; 12mm is right anyway). Reclassified content -> dev: it's a fork
    # config change (src/defaults.json) verified by the map render. Depends on C51.

