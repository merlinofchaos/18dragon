  C19:
    title: "Player-order cards"
    type: content
    epics: ["Game Components"]
    points: 3
    # "reference cards" dropped 2026-08-17 (designer) — an unneeded assumption; no reference
    # deck. C19 is the player-order deck only.
    # Designed 2026-08-17. Mockup: docs/mockups/player-order-mockup.html
    # via tools/mockup-player-order.mjs. Decisions: six cards 1-6, PORTRAIT 44x67 (the only
    # portrait card in the game — identifiable by orientation alone); the number is the card
    # (Leftfield Serif 300pt, ink ~50mm); ONE uniform back on all six so a face-down row
    # deals out random; square corners in print. Centering is measured, not eyeballed — the
    # NUDGE table in the mockup (up 9.4mm, vertical only) MUST come across to the
    # generator; CSS line-box centering is visibly wrong at this size. Horizontally the
    # digits are left on the box, NOT ink-centered — ink-centering the "1" shifted it
    # visibly right of its neighbours (designer, 2026-08-17).
    # Two alternates (foot caption; number repeated upside-down) were dropped.
    # REFERENCE-card half is still undesigned — story stays a stub until it is.
  C20:
    title: "Add Merger round to the rounds tracker (JSON)"
    type: content
    epics: ["Game Components", "Rules & Balance"]
    points: 1
  C21:
