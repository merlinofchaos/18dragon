# id -> title, type, epics, points. STATUS and SPRINT membership live in
# sprint-status.yaml. Epic definitions in epics.yaml. `points` is null until a
# story is pointed during sprint planning (agile-sprint-plan). This file changes
# when stories are added/split/re-titled or (re)pointed.

