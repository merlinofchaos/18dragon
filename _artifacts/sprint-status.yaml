      (standard tokens + share-price markers) at the correct real-world dimensions, and
      the Cameo stickers corrected to match (fixing the earlier wrong sizes). Tokens +
      stickers share one dimension spec. C51 pins the dimensions and fixes the stickers;
      C52 generates the STLs to that spec.
    stories:
      C51: done
      C52: done
      C53: done
