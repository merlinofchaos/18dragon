# 18Dragon — sprint & story status (CANONICAL)
#
# Stories live in exactly ONE bucket: `backlog` (unscheduled) or a sprint.
# A story's sprint is implied by its bucket — there is NO per-story sprint field.
# Status values: stub | ready | in-progress | review | done
