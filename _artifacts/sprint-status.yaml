    status: active
    goal: >-
      The signature 18Dragon mechanics are fully specified in docs/ — the 1822
      divergences, the region-permit gate, the Verantum ruins/metro value system,
      and the merger mechanic — with every PRD §9 open question resolved. This is
      the design substrate the rulebook (C22/C23) gets authored from; no rulebook
      prose is written here. The §9 open questions are owned by these stories:
      Verantum questions resolve inside C08, merger questions inside C13, and C14
      closes out the general ones + marks §9 resolved. Sequence C06→C07→C08→C13→C14.
    stories:
      C06: done
      C07: stub
      C08: stub
      C13: stub
      C14: stub
